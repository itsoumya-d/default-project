name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run rlvr-bias-probe tests (in-repo project)
        run: |
          pip install pytest
          python -m pytest tests -q -p no:cacheprovider
        working-directory: AI_ENGINEERING_PORTFOLIO/projects/project-11-rlvr-bias-probe
