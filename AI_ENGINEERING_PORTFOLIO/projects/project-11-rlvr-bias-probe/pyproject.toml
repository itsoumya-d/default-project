[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlvr-bias-probe"
version = "0.1.0"
description = "CPU-only GRPO vs Dr.GRPO length/difficulty bias experiment (synthetic verifiable-reward env)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Soumya Debnath"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["rlvr_bias_probe"]
